services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_password123"
      MSSQL_PID: "Developer"
    volumes:
      - sqlserver-data:/var/opt/mssql

  api:
    build:
      context: ./api
      dockerfile: src/HouseBroker.Api/Dockerfile
    depends_on:
      - sqlserver
    environment:
      ConnectionStrings__HouseBroker: "Server=sqlserver,1433;Database=HouseBroker;User Id=sa;Password=Your_password123;TrustServerCertificate=True"
      PathBase: "/api"

  auth:
    build:
      context: ./api
      dockerfile: src/HouseBroker.Auth/Dockerfile
    depends_on:
      - sqlserver
    environment:
      ConnectionStrings__HouseBroker: "Server=sqlserver,1433;Database=HouseBroker;User Id=sa;Password=Your_password123;TrustServerCertificate=True"
      PathBase: "/sso"

  nginx:
    image: nginx:alpine
    depends_on:
      - api
      - auth
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ui/dist:/usr/share/nginx/html:ro

volumes:
  sqlserver-data: {}
