# Gateway security and caching are applied per response. Rate limits are global per IP.
limit_req_zone $binary_remote_addr zone=api_global:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_search:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_write:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_upload:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    # Security headers applied to every response.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self';" always;

    # Static SPA assets: long-lived cache.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?|webmanifest)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA entry point: never cached.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files /index.html =404;
    }

    # API: forwarded headers, global per-IP throttling and no browser caching by default.
    location /api/ {
        limit_req zone=api_global burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /api;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        add_header Cache-Control "no-store" always;
    }

    # SSO/auth endpoints: dedicated, stricter per-IP throttling.
    location /sso/ {
        limit_req zone=auth_zone burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://auth:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /sso;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        add_header Cache-Control "no-store" always;
    }

    # SPA fallback.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}