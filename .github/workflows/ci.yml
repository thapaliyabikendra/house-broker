name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_scale_check:
        description: "Run optional scaled API checks"
        required: false
        default: "false"
        type: choice
        options: [ "false", "true" ]

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore api/HouseBroker.sln
      - run: dotnet format api/HouseBroker.sln --verify-no-changes
      - run: dotnet build api/HouseBroker.sln --configuration Release --no-restore
      - run: dotnet test api/HouseBroker.sln --no-build --configuration Release
      - run: dotnet list api/HouseBroker.sln package --vulnerable --include-transitive

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix ui ci
      - run: npm --prefix ui run lint
      - run: npm --prefix ui run format:check
      - run: npm --prefix ui run test
      - run: npm --prefix ui run build
      - run: npm --prefix ui run api:check
      - run: npm --prefix ui run i18n:check

  docker:
    runs-on: ubuntu-latest
    needs: [ dotnet, web ]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        run: docker build -f api/src/HouseBroker.Api/Dockerfile -t housebroker-api:ci ./api
      - name: Build Auth image
        run: docker build -f api/src/HouseBroker.Auth/Dockerfile -t housebroker-auth:ci ./api
      - name: Build gateway image
        run: docker build -f deploy/Dockerfile.gateway -t housebroker-gateway:ci ./deploy

  scale-check:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_scale_check == 'true' }}
    runs-on: ubuntu-latest
    needs: [ dotnet, web, docker ]
    steps:
      - uses: actions/checkout@v4
      - name: Start scaled stack
        run: docker compose -f docker-compose.prod.yml up -d --build --scale api=3
      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost/api/health/ready && curl -fsS http://localhost/sso/health/ready && exit 0
            sleep 5
          done
          exit 1
      - name: Smoke tests
        run: |
          curl -fsS http://localhost/
          curl -fsS http://localhost/api/v1/meta
          curl -fsS http://localhost/sso/.well-known/openid-configuration
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v